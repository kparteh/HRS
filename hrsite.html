<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2e68">
  <title>WorkSmart HR — People operations</title>
  <style>
    :root {
      --ink: #172823;
      --muted: #71817b;
      --line: #e8eeea;
      --paper: #ffffff;
      --canvas: #f6f8f6;
      --green: #4169e1;
      --green-2: #3157c8;
      --mint: #eaf0ff;
      --orange: #d98745;
      --orange-wash: #fff3e7;
      --blue: #577da8;
      --blue-wash: #edf3fa;
      --red: #b7554f;
      --red-wash: #fbefed;
      --shadow: 0 10px 28px rgba(28, 49, 41, .055);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 248px; background: #1b2e68; color: #fff; display: flex; flex-direction: column; padding: 25px 16px 18px; flex: 0 0 248px; }
    .brand { display: flex; gap: 11px; align-items: center; padding: 0 10px 30px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: #dfe7ff; color: #2748a2; font-size: 17px; font-weight: 800; }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.5px; }
    .brand-sub { display: block; color: #b5c4ef; font-size: 10px; margin-top: 3px; letter-spacing: .7px; text-transform: uppercase; }
    .nav-label { color: #a8b9ea; padding: 10px 12px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button { border: 0; background: transparent; color: #c9d4f2; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 12px; border-radius: 9px; font-size: 13px; transition: .15s ease; }
    .nav button:hover { color: white; background: rgba(255,255,255,.08); }
    .nav button.active { background: #2c4387; color: #fff; box-shadow: inset 3px 0 #9db4ff; }
    .nav-icon { width: 17px; text-align: center; opacity: .95; font-size: 16px; }
    .nav-count { margin-left: auto; border-radius: 20px; background: rgba(255,255,255,.13); padding: 2px 7px; font-size: 10px; }
    .sync-indicator { color: #64746d; font-size: 10px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
    .sync-indicator::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8d9c95; }
    .sync-indicator.connected::before { background: #4169e1; }
    .sync-indicator.syncing::before { background: #d98745; }
    .sync-indicator.error::before { background: #b7554f; }
    .login-card { max-width: 430px; margin: 8vh auto 0; padding: 25px; }
    .login-mark { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 14px; background: #eaf0ff; color: #3157c8; font-size: 21px; font-weight: 800; margin-bottom: 19px; }
    .login-card h1 { font-size: 22px; }
    .login-card .field { margin-top: 18px; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 16px; min-height: 42px; }
    .login-error { color: #a84d47; font-size: 11px; line-height: 1.5; margin-top: 12px; }
    .login-warning { color: #8a6331; background: #fff8e9; border: 1px solid #f2e5c7; border-radius: 8px; padding: 10px 12px; font-size: 11px; line-height: 1.5; margin-top: 14px; }
    body.local-locked aside, body.local-locked header { display: none; }
    body.local-locked .content { padding-top: 8vh; }
    .sidebar-bottom { margin-top: auto; }
    .help-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 11px; padding: 13px; margin: 15px 3px 17px; }
    .help-card strong { font-size: 12px; }
    .help-card p { color: #bdc9eb; font-size: 11px; line-height: 1.55; margin: 6px 0 0; }
    .user-mini { border-top: 1px solid rgba(255,255,255,.13); padding: 16px 7px 0; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: #e7edff; color: #3157c8; font-size: 11px; font-weight: 700; }
    .user-mini strong { font-size: 12px; display: block; }
    .user-mini span { display: block; color: #b6c4e8; font-size: 10px; margin-top: 3px; }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .topbar { min-height: 72px; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 38px; gap: 18px; }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .breadcrumbs strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .role-select { border: 1px solid var(--line); background: #fff; color: #486057; padding: 8px 30px 8px 10px; border-radius: 8px; font-size: 11px; }
    .icon-btn { border: 0; width: 35px; height: 35px; background: #f6f8f6; color: #5f7069; border-radius: 9px; position: relative; }
    .icon-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: #e38a4b; position: absolute; right: 8px; top: 7px; border: 1px solid white; }
    .top-user { display: flex; align-items: center; gap: 9px; border-left: 1px solid var(--line); padding-left: 15px; }
    .top-user .avatar { width: 33px; height: 33px; }
    .top-user strong { font-size: 11px; display: block; }
    .top-user span { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .content { width: 100%; max-width: 1450px; padding: 31px 38px 55px; margin: 0 auto; flex: 1; }
    .app-footer { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 24px 20px; color: #8591a7; font-size: 10px; letter-spacing: .2px; }
    .app-footer span + span::before { content: "·"; margin-right: 8px; color: #b2bbcb; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--green-2); font-size: 10px; letter-spacing: 1.15px; text-transform: uppercase; font-weight: 750; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.8px; font-weight: 680; }
    .subtitle { color: var(--muted); margin: 7px 0 0; font-size: 12px; }
    .btn { border: 1px solid #e0e6f4; color: #35466f; background: white; padding: 9px 13px; border-radius: 8px; font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; }
    .btn:hover { background: #f7faf8; }
    .btn-primary { background: var(--green); color: white; border-color: var(--green); }
    .btn-primary:hover { background: #205b4a; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-soft { background: var(--mint); color: var(--green); border-color: var(--mint); }
    .btn-danger { background: white; color: var(--red); border-color: #f0d8d5; }
    .btn-sm { padding: 6px 9px; font-size: 10px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 18px; }
    .card { background: var(--paper); border: 1px solid #edf1ee; border-radius: 12px; box-shadow: var(--shadow); }
    .kpi { padding: 17px 19px 16px; }
    .kpi-top { display: flex; justify-content: space-between; align-items: center; }
    .kpi-label { color: var(--muted); font-size: 11px; }
    .kpi-icon { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; background: var(--mint); color: var(--green); font-size: 15px; }
    .kpi-value { margin: 13px 0 8px; font-size: 26px; line-height: 1; font-weight: 680; letter-spacing: -.8px; }
    .kpi-note { color: var(--muted); font-size: 10px; }
    .kpi-note b { color: var(--green-2); font-weight: 650; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, .9fr); gap: 17px; margin-bottom: 17px; }
    .card-head { padding: 17px 19px 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card-head h2 { margin: 0; font-size: 13px; font-weight: 680; }
    .card-head p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .chart-wrap { padding: 7px 17px 15px; height: 220px; }
    .chart-wrap svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart-grid { stroke: #edf1ee; stroke-width: 1; }
    .chart-line { fill: none; stroke: #4169e1; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: url(#area); }
    .chart-dot { fill: white; stroke: #4169e1; stroke-width: 2.5; }
    .chart-label { fill: #8a9892; font-size: 9px; }
    .attendance-card { padding-bottom: 14px; }
    .attendance-number { padding: 9px 19px 3px; font-size: 31px; letter-spacing: -1px; font-weight: 680; }
    .attendance-number span { font-size: 12px; color: var(--muted); font-weight: 450; letter-spacing: 0; }
    .bar-track { height: 7px; border-radius: 9px; background: #edf2ee; margin: 11px 19px 16px; overflow: hidden; }
    .bar-fill { width: 86%; height: 100%; background: #5478e8; border-radius: inherit; }
    .attendance-breakdown { display: grid; gap: 10px; padding: 0 19px; }
    .break-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--muted); }
    .break-row strong { color: var(--ink); font-size: 10px; }
    .legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: #5478e8; }
    .legend-dot.late { background: #e7a064; }
    .legend-dot.absent { background: #d67c73; }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, .85fr); gap: 17px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th { color: #83918b; font-size: 9px; font-weight: 650; letter-spacing: .6px; text-align: left; padding: 10px 16px; background: #fbfcfb; border-top: 1px solid #f0f3f1; border-bottom: 1px solid #eef2ef; text-transform: uppercase; }
    td { padding: 12px 16px; border-bottom: 1px solid #f0f3f1; color: #4c5e56; font-size: 10px; }
    tr:last-child td { border-bottom: 0; }
    td strong { color: var(--ink); font-weight: 620; }
    .person-cell { display: flex; align-items: center; gap: 9px; }
    .person-cell .avatar { width: 29px; height: 29px; font-size: 9px; }
    .person-cell small { display: block; color: #8b9892; font-size: 9px; margin-top: 3px; }
    .status { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 8px; font-size: 9px; font-weight: 650; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.active, .status.approved, .status.paid, .status.present { color: #368064; background: #e9f4ed; }
    .status.pending, .status.late, .status.review, .status.setup-required { color: #b57b37; background: #fff4e6; }
    .status.inactive, .status.absent, .status.rejected { color: #b55e57; background: #faeeec; }
    .activity-list { padding: 2px 18px 14px; }
    .activity-item { display: flex; gap: 11px; padding: 12px 0; border-bottom: 1px solid #f0f3f1; }
    .activity-item:last-child { border-bottom: 0; }
    .activity-icon { width: 29px; height: 29px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto; color: var(--green-2); background: var(--mint); font-size: 12px; }
    .activity-item p { margin: 1px 0 4px; font-size: 10px; line-height: 1.45; color: #54655e; }
    .activity-item p strong { color: var(--ink); }
    .activity-item small { color: #94a099; font-size: 9px; }
    .section-card { padding: 0; }
    .section-toolbar { padding: 0 18px 15px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .search-input, .filter-select, .field input, .field select, .field textarea { border: 1px solid #e6ece8; border-radius: 7px; padding: 9px 10px; outline: none; color: #334840; background: #fff; font-size: 11px; }
    .search-input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #91a9f2; box-shadow: 0 0 0 3px rgba(65,105,225,.11); }
    .search-input { width: 220px; }
    .filter-select { padding: 8px 10px; }
    .toolbar-spacer { flex: 1; }
    .page-card { padding: 18px; }
    .notice { border: 1px solid #f1ddbf; background: #fff9ed; color: #795c30; border-radius: 9px; padding: 11px 13px; line-height: 1.55; font-size: 10px; margin: 0 18px 16px; }
    .notice strong { color: #65491e; }
    .notice.blue { border-color: #dae5f2; background: #f3f7fc; color: #4c627d; }
    .notice.red { border-color: #f0d9d6; background: #fff6f4; color: #8a4f49; }
    .summary-strip { display: flex; gap: 26px; flex-wrap: wrap; padding: 16px 19px; border-bottom: 1px solid #eef2ef; }
    .summary-item span { color: var(--muted); display: block; font-size: 9px; margin-bottom: 5px; }
    .summary-item strong { font-size: 16px; font-weight: 680; }
    .summary-item small { color: var(--muted); font-size: 9px; margin-left: 4px; }
    .empty-state { text-align: center; padding: 42px 20px; color: var(--muted); font-size: 11px; }
    .empty-state strong { color: #496057; display: block; font-size: 13px; margin-bottom: 5px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .setting-card { padding: 17px; }
    .setting-card h3 { font-size: 12px; margin: 0 0 5px; }
    .setting-card > p { font-size: 10px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 10px; color: #66776f; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; }
    .field textarea { min-height: 70px; resize: vertical; }
    .rule-table td, .rule-table th { padding: 9px 11px; }
    .rule-table input { width: 88px; padding: 6px 7px; border: 1px solid #e6ece8; border-radius: 5px; font-size: 10px; }
    .role-matrix td, .role-matrix th { padding: 9px 12px; }
    .check { color: #398267; font-weight: 700; }
    .cross { color: #c4cec8; }
    .clock-card { text-align: center; padding: 27px 20px; }
    .clock-time { font-size: 43px; font-weight: 650; letter-spacing: -2px; margin: 12px 0 4px; }
    .clock-date { color: var(--muted); font-size: 11px; margin-bottom: 20px; }
    .clock-card .btn { margin: 0 4px; }
    .clock-state { display: inline-flex; padding: 6px 10px; background: var(--mint); color: var(--green-2); border-radius: 20px; font-size: 10px; }
    .clock-state.out { background: #f0f3f1; color: #6c7a74; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(20,38,31,.42); }
    .modal { width: min(550px, 100%); max-height: 92vh; overflow: auto; background: white; border-radius: 13px; box-shadow: 0 20px 70px rgba(20,40,32,.2); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 19px 21px 14px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 15px; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .modal-body { padding: 18px 21px; }
    .modal-foot { border-top: 1px solid var(--line); padding: 13px 21px; display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; bottom: 22px; right: 23px; z-index: 30; padding: 12px 16px; border-radius: 9px; background: #1b2e68; color: white; font-size: 11px; box-shadow: 0 8px 30px #1b2e6833; animation: rise .2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu { display: none; }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    @media(max-width: 1050px) {
      .sidebar { width: 215px; flex-basis: 215px; }
      .content { padding: 26px 23px 45px; }
      .topbar { padding: 0 23px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 760px) {
      .sidebar { display: none; position: fixed; z-index: 10; inset: 0 auto 0 0; width: 250px; }
      .sidebar.open { display: flex; }
      .mobile-menu { display: inline-grid; place-items: center; }
      .topbar { min-height: 62px; padding: 0 15px; }
      .content { padding: 22px 14px 35px; }
      .dashboard-grid, .lower-grid { grid-template-columns: 1fr; }
      .page-heading { align-items: flex-start; }
      .page-heading h1 { font-size: 22px; }
      .top-user > div:last-child { display: none; }
      .role-select { max-width: 126px; }
      .kpi { padding: 14px; }
      .kpi-value { font-size: 23px; }
      .two-col { grid-template-columns: 1fr; }
    }
    @media(max-width: 440px) {
      .kpi-grid { gap: 9px; }
      .kpi-label { font-size: 10px; }
      .kpi-icon { display: none; }
      .top-actions { gap: 7px; }
      .top-user { padding-left: 8px; }
      .search-input { width: 100%; }
      .section-toolbar .search-input { flex: 1; }
      .page-heading { gap: 8px; }
      .field-grid { grid-template-columns: 1fr; }
    }
    :root {
      --ink: #17233d;
      --muted: #74819a;
      --line: #e6eaf2;
      --paper: #fff;
      --canvas: #f4f6fb;
      --green: #4169e1;
      --green-2: #294fca;
      --mint: #edf1ff;
      --shadow: 0 8px 26px rgba(34, 52, 98, .055);
      color-scheme: light;
    }
    body { background: radial-gradient(ellipse at 80% -15%, #e8edff 0, transparent 35%), var(--canvas); color: var(--ink); }
    button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(65,105,225,.24);
      outline-offset: 2px;
    }
    .sidebar {
      background: linear-gradient(165deg, #1b2e68 0%, #182858 55%, #111e45 100%);
      box-shadow: 8px 0 28px rgba(21, 35, 79, .08);
    }
    .brand { padding-bottom: 34px; }
    .brand-mark { box-shadow: 0 5px 14px rgba(6, 16, 49, .2); }
    .nav-label { padding-top: 13px; letter-spacing: 1.25px; }
    .nav button { min-height: 42px; border-radius: 10px; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .nav button:hover { transform: translateX(2px); }
    .nav button.active { background: linear-gradient(100deg, rgba(126,156,255,.27), rgba(126,156,255,.1)); box-shadow: inset 3px 0 #a9bdff; }
    .help-card { background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.045)); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 76px;
      background: rgba(255,255,255,.9);
      border-bottom-color: rgba(222,228,241,.9);
      backdrop-filter: blur(14px);
    }
    .breadcrumbs strong { font-weight: 700; }
    .sync-indicator { border: 1px solid var(--line); border-radius: 20px; padding: 7px 10px; background: #fff; color: #64728c; }
    .sync-indicator::before { box-shadow: 0 0 0 3px rgba(115,129,154,.1); }
    .sync-indicator.connected::before { box-shadow: 0 0 0 3px rgba(65,105,225,.12); }
    .sync-indicator.syncing::before { box-shadow: 0 0 0 3px rgba(217,135,69,.14); }
    .sync-indicator.error::before { box-shadow: 0 0 0 3px rgba(183,85,79,.12); }
    .role-select { color: #33466f; border-color: #e0e6f2; border-radius: 9px; padding-top: 9px; padding-bottom: 9px; }
    .top-user { border-left-color: #e8ebf2; }
    .content { padding-top: 34px; }
    .page-heading { margin-bottom: 26px; }
    .page-heading h1 { color: #182543; font-size: clamp(23px, 2vw, 29px); letter-spacing: -.9px; }
    .subtitle { color: #78859c; line-height: 1.55; }
    .eyebrow { letter-spacing: 1.35px; }
    .btn {
      border-color: #e0e6f2;
      color: #405273;
      border-radius: 9px;
      padding: 9px 14px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
    }
    .btn:hover { background: #f6f8ff; border-color: #cbd6f1; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(41,79,202,.08); }
    .btn-primary { color: #fff; background: linear-gradient(135deg, #4b72eb, #3157d0); border-color: #3157d0; box-shadow: 0 5px 14px rgba(49,87,208,.2); }
    .btn-primary:hover { color: #fff; background: linear-gradient(135deg, #3e65dc, #264abe); border-color: #264abe; box-shadow: 0 7px 18px rgba(49,87,208,.24); }
    .btn-soft { color: #3157c8; background: #edf1ff; border-color: #e6ebff; }
    .btn-danger:hover { color: #a24743; background: #fff6f4; border-color: #ebc9c5; }
    .card {
      border-color: #e9edf5;
      border-radius: 15px;
      box-shadow: 0 7px 24px rgba(31,48,93,.045);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .card-head { padding: 19px 21px 14px; }
    .card-head h2 { color: #1e2b49; font-size: 14px; }
    .card-head p { color: #8290a7; line-height: 1.5; }

          <section class="card section-card"><div class="card-head"><div><h2>Team directory</h2><p>People records, work details and monthly base pay</p></div><button class="btn btn-sm" data-action="export-staff">↓ Export CSV</button></div>
            <div class="section-toolbar"><input class="search-input" id="people-search" placeholder="⌕  Search name, role, department…" value="${esc(query)}"><select class="filter-select" id="people-filter"><option>All</option><option ${statusFilter === "Active" ? "selected" : ""}>Active</option><option ${statusFilter === "Inactive" ? "selected" : ""}>Inactive</option></select><span class="toolbar-spacer"></span><span class="muted" style="font-size:10px">${state.staff.length} records</span></div>
            <div class="table-wrap"><table><thead><tr><th>Team member</th><th>Email</th><th>Department</th><th>Location</th><th>Monthly base</th><th>Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="7"><div class="empty-state"><strong>No matching team members</strong>Try another search or add a person.</div></td></tr>`}</tbody></table></div>

      function renderAttendance() {
        const staff = visibleStaff();
        const records = dailyRecords(staff);
        const count = records.filter(x => x.status === "Present").length;
        const selectableClock = state.role !== "employee" && ["admin", "hr"].includes(state.role);
        const selectedEmployeeId = selectableClock
          ? (document.getElementById("clock-employee")?.value || staff[0]?.id || "")
          : state.role === "employee" ? ownEmployeeId() : "H-1001";
        const currentRecord = records.find(item => item.employeeId === selectedEmployeeId);
        const clock = state.clock[clockKey(selectedEmployeeId)] || {
          in: currentRecord && currentRecord.in !== "—" ? currentRecord.in : "",
          out: currentRecord?.out || ""
        };
        const rows = records.map(a => {

            : "";
          const gps = [gpsLink(a.inLatitude, a.inLongitude, a.inAccuracy, "In"), gpsLink(a.outLatitude, a.outLongitude, a.outAccuracy, "Out")].filter(Boolean).join("<br>") || `<span class="muted">Not captured</span>`;
          return `<tr><td>${personCell(p)}</td><td>${dateLabel(a.date, { weekday: "short", month: "short", day: "numeric" })}</td><td>${esc(a.in)}</td><td>${esc(a.out || "—")}</td><td>${statusBadge(a.status)}</td><td>${gps}</td><td>${p?.location || "—"}</td><td>${p ? `<button class="btn btn-sm" data-action="employee-documents" data-id="${esc(p.id)}">Review evidence</button>` : "—"}</td></tr>`;

          <section class="card section-card"><div class="card-head"><div><h2>Daily attendance log</h2><p>Today · ${dateLabel(isoToday, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</p></div><button class="btn btn-sm" data-action="refresh-attendance">Refresh</button></div>
          <div class="table-wrap"><table><thead><tr><th>Team member</th><th>Date</th><th>Clock in</th><th>Clock out</th><th>Attendance</th><th>GPS evidence</th><th>Work location</th><th>Photo / documents</th></tr></thead><tbody>${rows || `<tr><td colspan="8"><div class="empty-state">No attendance records for today.</div></td></tr>`}</tbody></table></div></section>`;
      }
      function taxForLRD(monthlyLRD) {
        const annual = Math.max(0, monthlyLRD * 12);
        let tax = 0;
        for (const bracket of state.taxBrackets) {
          const lower = Number(bracket.from) || 0;
          const upper = bracket.to === null || bracket.to === "" ? Infinity : Number(bracket.to);
          const taxable = Math.max(0, Math.min(annual, upper) - lower);
          tax += taxable * Number(bracket.rate || 0) / 100;
        }
        return tax / 12;
      }
      function calculatePayroll(p) {
        const gross = toLRD(p.salary, p.currency);
        const employeeContribution = gross * Number(state.contributions.employee || 0) / 100;
        const incomeTax = taxForLRD(gross);
        const netLRD = Math.max(0, gross - employeeContribution - incomeTax);
        const employerContribution = gross * Number(state.contributions.employer || 0) / 100;
        const workInjury = gross * Number(state.contributions.workInjury || 0) / 100;
        return { gross, employeeContribution, incomeTax, netLRD, employerContribution, workInjury, net: fromLRD(netLRD, p.currency), currency: p.currency };
      }
      function renderPayroll() {
        if (!can("payroll")) return restricted();

        const cur = state.organization.currency;
        const rows = staff.map(p => {
          const c = calculatePayroll(p);
          return `<tr><td>${personCell(p)}</td><td>${money(p.salary, p.currency)}</td><td>${payrollReady ? money(fromLRD(c.incomeTax, p.currency), p.currency) : "Not configured"}</td><td>${payrollReady ? money(fromLRD(c.employeeContribution, p.currency), p.currency) : "Not configured"}</td><td><strong>${payrollReady ? money(c.net, p.currency) : "Not configured"}</strong></td><td>${statusBadge(payrollReady ? "Review" : "Setup required")}</td></tr>`;
        }).join("");
        const recent = state.payrollRuns.slice().reverse().map(run => `<tr><td><strong>${esc(run.period)}</strong></td><td>${dateLabel(run.created)}</td><td>${run.count} employees</td><td>${money(run.gross, run.currency)}</td><td>${money(run.net, run.currency)}</td><td>${statusBadge(run.status)}</td></tr>`).join("");
        return `${layoutHeading("Compensation", "Payroll", "Review estimated deductions and prepare a multi-currency payroll run.", `<button class="btn btn-primary" data-action="run-payroll" ${payrollReady ? "" : "disabled title=\"Verify payroll rules and the exchange rate in Settings first\""}>Run payroll →</button>`)}
          <div class="notice"><strong>${payrollReady ? "Payroll rules marked verified by an administrator." : "Payroll draft creation is blocked until setup is verified."}</strong> Income-tax bands, contributions, and the exchange rate are administrator-managed assumptions—not legal advice. Confirm current Liberia Revenue Authority and NASSCORP requirements, coverage, exemptions, filing cadence, and dated FX source before payroll.</div>
          <div class="summary-strip card" style="margin-bottom:16px"><div class="summary-item"><span>Monthly gross estimate</span><strong>${state.organization.exchangeRateVerified ? money(fromLRD(sumsLRD.gross, cur), cur) : "FX not verified"}</strong><small>${staff.length} employees</small></div><div class="summary-item"><span>Income-tax estimate</span><strong>${payrollReady ? money(fromLRD(sumsLRD.tax, cur), cur) : "Not configured"}</strong></div><div class="summary-item"><span>Employee contribution estimate</span><strong>${payrollReady ? money(fromLRD(sumsLRD.contrib, cur), cur) : "Not configured"}</strong></div><div class="summary-item"><span>Estimated net pay</span><strong>${payrollReady ? money(fromLRD(sumsLRD.net, cur), cur) : "Not configured"}</strong></div></div>
          <section class="card section-card" style="margin-bottom:16px"><div class="card-head"><div><h2>Payroll preview</h2><p>Monthly salary basis · tax bands applied to annualized LRD equivalent · output remains in employee currency</p></div><button class="btn btn-sm" data-action="export-payroll" ${payrollReady ? "" : "disabled"}>↓ Export preview</button></div>
          <div class="table-wrap"><table><thead><tr><th>Team member</th><th>Gross monthly</th><th>Est. income tax</th><th>Est. employee contribution</th><th>Est. net pay</th><th>Review</th></tr></thead><tbody>${rows}</tbody></table></div></section>
          <section class="card section-card"><div class="card-head"><div><h2>Payroll history</h2><p>${SHEETS_SYNC.active ? "Draft runs are saved in Sheets; no bank payment or statutory filing is made." : "Locally saved draft runs · not submitted to a bank or tax authority"}</p></div></div>
          <div class="table-wrap"><table><thead><tr><th>Pay period</th><th>Prepared</th><th>Team</th><th>Gross total</th><th>Net total</th><th>Status</th></tr></thead><tbody>${recent || `<tr><td colspan="6"><div class="empty-state">No payroll runs yet.<br>Use “Run payroll” to create a local draft.</div></td></tr>`}</tbody></table></div></section>`;
      }
      function renderLeave() {
        if (!can("leave")) return restricted();
        const isEmployee = state.role === "employee";

      function randomWebAuthnChallenge() {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        return bytes;
      }
      function encodeCredentialId(bytes) {
        let binary = "";
        new Uint8Array(bytes).forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }
      function decodeCredentialId(value) {
        const binary = atob(value.replace(/-/g, "+").replace(/_/g, "/"));
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      }
      async function setupDemoPasskey() {
        if (SHEETS_SYNC.active) throw new Error("Passkeys are not configured for the Google Sheets deployment.");
        if (!window.isSecureContext || !navigator.credentials || !window.PublicKeyCredential) {
          throw new Error("Device passkeys require a supported browser on localhost or HTTPS.");
        }
        const person = employee(ownEmployeeId());
        if (!person) throw new Error("No employee record is linked to this demo role.");
        const credential = await navigator.credentials.create({ publicKey: {
          challenge: randomWebAuthnChallenge(),
          rp: { name: "WorkSmart HR Local Demo", id: location.hostname },
          user: { id: new TextEncoder().encode(person.id), name: person.email, displayName: person.name },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "preferred", userVerification: "required" },
          timeout: 60000,
          attestation: "none"
        } });
        if (!credential) throw new Error("No device passkey was created.");
        localStorage.setItem(DEMO_PASSKEY_PREFIX + person.id, encodeCredentialId(credential.rawId));
        render();
        toast("Device passkey set up for this local demo.");
      }
      async function verifyDemoPasskey() {
        if (SHEETS_SYNC.active) return true;
        const encodedId = localStorage.getItem(DEMO_PASSKEY_PREFIX + ownEmployeeId());
        if (!encodedId) throw new Error("Set up a device passkey before using clock-in/out.");
        if (!window.isSecureContext || !navigator.credentials || !window.PublicKeyCredential) {
          throw new Error("Device passkeys require a supported browser on localhost or HTTPS.");
        }
        const assertion = await navigator.credentials.get({ publicKey: {
          challenge: randomWebAuthnChallenge(),
          allowCredentials: [{ type: "public-key", id: decodeCredentialId(encodedId) }],
          userVerification: "required",
          timeout: 60000
        } });
        if (!assertion || encodeCredentialId(assertion.rawId) !== encodedId) {
          throw new Error("Device passkey verification did not complete.");
        }
      }
      async function doClock(action) {
        if (!guard("attendance")) return;
        const id = state.role === "employee" ? ownEmployeeId() :
          ["admin", "hr"].includes(state.role) ? document.getElementById("clock-employee")?.value || (SHEETS_SYNC.active ? "" : "H-1001") : "";
        if (!id) return toast("This account has no linked employee record. Ask an admin to link one.");
        if (!SHEETS_SYNC.active && !localStorage.getItem(DEMO_PASSKEY_PREFIX + ownEmployeeId())) {
          return toast("Set up a device passkey before using clock-in/out.");
        }
        try {
          await verifyDemoPasskey();
        } catch (error) {
          if (error.name === "NotAllowedError") return toast("Device verification was cancelled.");
          console.error("Local demo passkey prompt failed.", error);
          return toast(error.message || "Device verification failed.");
        }
        const prior = state.attendance.find(item => item.employeeId === id && item.date === isoToday);
        const currentClock = state.clock[clockKey(id)] || { in: prior?.in === "—" ? "" : prior?.in || "", out: prior?.out || "" };
        if (action === "clock-in" && currentClock.in && !currentClock.out) return toast("This employee is already clocked in.");
        if (action === "clock-out" && (!currentClock.in || currentClock.out)) return toast("Clock in before clocking out.");
        if (SHEETS_SYNC.active) {
          if (!navigator.geolocation) return toast("This browser does not support GPS location.");
          try {
            const position = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true, timeout: 15000, maximumAge: 0
            }));
            pendingClockEvidence = { action, employeeId: id, latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy, photo: "" };
            openAttendanceCamera(action);
          } catch (error) {
            console.error("Attendance GPS capture failed.", error);
            const message = error.code === 1 ? "Allow location access in your browser to clock in or out." :
              error.code === 3 ? "GPS took too long. Move to an area with a clear signal and retry." :
              "Could not capture GPS location. Check device location settings and retry.";
            toast(message);
          }
          return;
        }
        recordClock(action, id, null);
      }
      function recordClock(action, id, evidence) {
        const now = new Date();
        const time = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Africa/Monrovia" });
        const key = clockKey(id);
        const existingRecord = state.attendance.find(x => x.employeeId === id && x.date === isoToday);
        const clock = state.clock[key] || { in: existingRecord?.in === "—" ? "" : existingRecord?.in || "", out: existingRecord?.out || "" };
        if (action === "clock-in") {
          if (clock.in && !clock.out) return toast("This employee is already clocked in.");
          state.clock[key] = { in: time, out: "" };

          const email = String(data.email || "").trim().toLowerCase();
          if (state.access.some(user => user.email.toLowerCase() === email)) return toast("That email already has application access.");
          if (data.role === "employee" && !state.staff.some(person => person.id === data.employeeId)) return toast("Choose a valid employee ID before granting employee access.");
          if (data.role === "manager" && !data.department.trim()) return toast("Managers need a department scope.");
          state.access.push({ email, role: data.role, active: true, employeeId: data.employeeId.trim(), department: data.department.trim() });
          event.target.reset();
          const saved = persist(); render();
          if (saved) toast("Application access granted.");
          return;
        }
        if (event.target.id !== "modal-form") return;
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target).entries());
        const action = document.getElementById("overlay-root").dataset.formAction || "";
        if (action.startsWith("add-employee") || action.startsWith("edit:")) {
          if (!guard("people")) return;
          const salary = Number(data.salary);
          if (!Number.isFinite(salary) || salary < 0) return toast("Enter a valid non-negative salary.");
          if (state.staff.some(p => p.email.toLowerCase() === data.email.toLowerCase() && p.id !== action.split(":")[1])) return toast("A team member with that email already exists.");
          if (action.startsWith("edit:")) {
            const p = employee(action.slice(5));
            if (p) Object.assign(p, data, { salary });
          } else {
            const next = Math.max(1000, ...state.staff.map(p => Number(p.id.slice(2)) || 0)) + 1;
            state.staff.push({ ...data, salary, id: `H-${next}`, start: data.start || isoToday });
          }
          const saved = persist(); document.getElementById("overlay-root").innerHTML = ""; render(); if (saved) toast(action.startsWith("edit:") ? "Team member updated." : "Team member added.");
        } else if (action === "request-leave") {
          if (!guard("leave")) return;
          if (data.end < data.start) return toast("End date must be on or after the start date.");
          const count = Number(data.days);
          if (!Number.isInteger(count) || count < 1) return toast("Enter at least one working day.");
          state.leave.push({ ...data, days: count, id: "LV-" + Date.now(), status: "Pending" });
          const saved = persist(); document.getElementById("overlay-root").innerHTML = ""; render(); if (saved) toast("Leave request submitted.");
        }
      });
      document.addEventListener("input", event => {
        if (event.target.id === "people-search") { query = event.target.value; const pos = event.target.selectionStart; render(); const input = document.getElementById("people-search"); input.focus(); input.setSelectionRange(pos, pos); }
      });
      document.addEventListener("change", event => {
        if (event.target.id === "role-switch" && !SHEETS_SYNC.active) { state.role = event.target.value; page = "dashboard"; persist(); render(); }
        if (event.target.id === "people-filter") { statusFilter = event.target.value; render(); }
        if (event.target.id === "clock-employee") render();
        if (event.target.id === "attendance-camera-file") useAttendancePhoto(event.target.files[0]);
      });
      document.getElementById("alerts-btn").addEventListener("click", () => toast(`${pendingLeave().length} leave request${pendingLeave().length === 1 ? "" : "s"} waiting for review.`));
      document.getElementById("local-logout").addEventListener("click", () => {
        stopAttendanceCamera();
        pendingClockEvidence = null;
        page = "dashboard";
        document.getElementById("overlay-root").innerHTML = "";
        if (SHEETS_SYNC.active) {
          SHEETS_SYNC.userSignedOut = true;
          SHEETS_SYNC.ready = false;
          SHEETS_SYNC.revision = null;
          SHEETS_SYNC.fingerprint = "";
          SHEETS_SYNC.email = "";
          SHEETS_SYNC.loginError = "";
          state = structuredClone(seed);
        } else {
          localAuthenticated = false;
          localLoginError = "";
        }
        render();
        toast(SHEETS_SYNC.active ? "Signed out of WorkSmart. Your Google account remains signed in." : "Signed out of the local demo.");
      });
      document.getElementById("menu-toggle").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
      render();
      if (SHEETS_SYNC.active) {
        fetchWorkspace();
        setInterval(() => {
          if (SHEETS_SYNC.ready && !SHEETS_SYNC.busy && !document.hidden && !document.getElementById("overlay-root").innerHTML &&
              !(page === "settings" && document.activeElement?.matches("input, select, textarea"))) fetchWorkspace(true);
        }, 15000);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && SHEETS_SYNC.ready && !SHEETS_SYNC.busy) fetchWorkspace(true);
        });
      }
      setInterval(() => {
        const node = document.getElementById("live-clock");
        if (node) node.textContent = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Africa/Monrovia" }).format(new Date());
      }, 1000);
    })();
  </script>
</body>
